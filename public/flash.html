<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050509">
<title>Flashcall</title>

<style>
  :root {
    --bg: #050509;
    --text: #f8fafc;
    --muted: #8b8d98;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .ambient {
    position: fixed;
    inset: -30%;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 30%),
      radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 28%);
    animation: breathe 4s ease-in-out infinite;
  }

  .signal-ring {
    position: fixed;
    width: min(78vw, 430px);
    aspect-ratio: 1;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 50%;
    opacity: 0;
    animation: signal 3s ease-out infinite;
    pointer-events: none;
  }

  .signal-ring:nth-child(2) {
    animation-delay: 1s;
  }

  .signal-ring:nth-child(3) {
    animation-delay: 2s;
  }

  .flash {
    position: relative;
    z-index: 2;
    width: min(100%, 520px);
    text-align: center;
  }

  .mark {
    width: 54px;
    height: 54px;
    margin: 0 auto 28px;
    position: relative;
    display: grid;
    place-items: center;
  }

  .mark::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
    border-radius: 16px;
    transform: rotate(45deg) scale(.72);
    box-shadow:
      0 0 28px color-mix(in srgb, var(--accent) 35%, transparent);
    animation: markPulse 2s ease-in-out infinite;
  }

  .mark::after {
    content: "F";
    position: relative;
    z-index: 1;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -2px;
    color: white;
  }

  .brand {
    margin-bottom: 36px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
  }

  #message {
    margin: 0 auto;
    max-width: 720px;
    font-size: clamp(34px, 9vw, 72px);
    line-height: .98;
    letter-spacing: -0.055em;
    font-weight: 850;
    overflow-wrap: anywhere;
    text-wrap: balance;
    text-shadow:
      0 0 35px color-mix(in srgb, var(--accent) 18%, transparent);
  }

  #countdown {
    margin-top: 34px;
    font-variant-numeric: tabular-nums;
    font-size: clamp(48px, 13vw, 92px);
    line-height: 1;
    letter-spacing: -0.06em;
    font-weight: 800;
    color: var(--accent);
    text-shadow:
      0 0 30px color-mix(in srgb, var(--accent) 45%, transparent);
  }

  .label {
    margin-top: 12px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .28em;
    text-transform: uppercase;
  }

  #expired {
    display: none;
  }

  #expired-title {
    margin: 0;
    font-size: 26px;
    letter-spacing: .04em;
    font-weight: 800;
  }

  #again {
    display: inline-block;
    margin-top: 18px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
  }

  #again:hover {
    color: var(--text);
  }

  .cut {
    animation: signalCut .45s cubic-bezier(.7, 0, .3, 1) forwards;
  }

  /* NIGHT */
  body[data-theme="night"] {
    --bg: #050509;
    --accent: #8b5cf6;
    --accent-2: #6366f1;
  }

  /* HEAT */
  body[data-theme="heat"] {
    --bg: #090505;
    --accent: #ff5a36;
    --accent-2: #f59e0b;
  }

  /* WAVE */
  body[data-theme="wave"] {
    --bg: #03090d;
    --accent: #22d3ee;
    --accent-2: #0ea5e9;
  }

  /* CLEAN */
  body[data-theme="clean"] {
    --bg: #08090b;
    --accent: #e5e7eb;
    --accent-2: #94a3b8;
  }

  @keyframes breathe {
    0%, 100% {
      transform: scale(.95);
      opacity: .65;
    }
    50% {
      transform: scale(1.05);
      opacity: 1;
    }
  }

  @keyframes signal {
    0% {
      transform: scale(.35);
      opacity: .55;
    }
    100% {
      transform: scale(1.8);
      opacity: 0;
    }
  }

  @keyframes markPulse {
    0%, 100% {
      transform: rotate(45deg) scale(.72);
      opacity: .6;
    }
    50% {
      transform: rotate(45deg) scale(.9);
      opacity: 1;
    }
  }

  @keyframes signalCut {
    0% {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
    55% {
      opacity: .65;
      transform: scale(.97);
    }
    100% {
      opacity: 0;
      transform: scale(.88);
      filter: blur(8px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .ambient,
    .signal-ring,
    .mark::before {
      animation: none;
    }
  }
</style>
</head>

<body data-theme="night">

<div class="ambient"></div>
<div class="signal-ring"></div>
<div class="signal-ring"></div>
<div class="signal-ring"></div>

<main class="flash" id="flash">
  <div class="mark" aria-label="Flashcall"></div>
  <div class="brand">Flashcall</div>

  <section id="live">
    <div id="message"></div>
    <div id="countdown"></div>
    <div class="label">Signal active</div>
  </section>

  <section id="expired">
    <h1 id="expired-title">SIGNAL ENDED</h1>
    <a id="again" href="/">Send another Flash →</a>
  </section>
</main>

<script>
  const params = new URLSearchParams(window.location.search);

  const allowedThemes = new Set([
    'night',
    'heat',
    'wave',
    'clean'
  ]);

  const message = params.get('message') || 'Flash nearby!';
  const expiresAt = new Date(params.get('expiresAt'));
  const requestedTheme = params.get('theme') || 'night';
  const theme = allowedThemes.has(requestedTheme)
    ? requestedTheme
    : 'night';

  document.body.dataset.theme = theme;
  document.getElementById('message').textContent = message;

  const live = document.getElementById('live');
  const expired = document.getElementById('expired');
  const flash = document.getElementById('flash');
  const countdown = document.getElementById('countdown');

  let ended = false;

  function endFlash() {
    if (ended) return;
    ended = true;

    flash.classList.add('cut');

    setTimeout(() => {
      live.style.display = 'none';
      expired.style.display = 'block';
      flash.classList.remove('cut');
    }, 450);
  }

  function tick() {
    const diff = expiresAt - new Date();

    if (!Number.isFinite(diff) || diff <= 0) {
      endFlash();
      return;
    }

    const minutes = Math.floor(diff / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    countdown.textContent =
      `${minutes}:${seconds.toString().padStart(2, '0')}`;

    requestAnimationFrame(tick);
  }

  if (Number.isNaN(expiresAt.getTime())) {
    endFlash();
  } else {
    tick();
  }
</script>

</body>
</html>
