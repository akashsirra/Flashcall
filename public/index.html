<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcall</title>
<link rel="manifest" href="/manifest.json">
<style>
  body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 24px; }
  input, select, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; box-sizing: border-box; }
  button { background: #ff3b30; color: white; border: none; border-radius: 8px; }
  #status { margin-top: 16px; color: #555; }
</style>
</head>
<body>
  <h1>⚡ Flashcall</h1>
  <p>Send a message to everyone nearby, right now.</p>

  <input type="text" id="message" placeholder="What's happening?" maxlength="100">
  <select id="duration">
    <option value="5">5 minutes</option>
    <option value="15" selected>15 minutes</option>
    <option value="30">30 minutes</option>
    <option value="60">60 minutes</option>
  </select>
  <button id="sendBtn">Send Flash</button>

  <div id="status"></div>

  <script src="/app.js"></script>
</body>
</html>
